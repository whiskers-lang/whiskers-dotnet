name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Whiskers.slnx

      - name: Build
        run: dotnet build Whiskers.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test Whiskers.slnx --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Whiskers/Whiskers.csproj --configuration Release --no-build --output ${{ runner.temp }}/pkg

      - name: NuGet login (OIDC → short-lived API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: |
          dotnet nuget push "${{ runner.temp }}/pkg/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
